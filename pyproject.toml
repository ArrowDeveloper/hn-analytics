[project]
name = "hn-analytics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv",
    "pandas",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
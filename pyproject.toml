[project]
name = "hn-analytics"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv",
    "pandas",
    "structlog",
    "tenacity",
    "fastapi",
    "uvicorn"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests requiring a real database"]

[project.optional-dependencies]
test = ["pytest", "respx", "pytest-asyncio", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]